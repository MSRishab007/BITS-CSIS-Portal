# /etc/nginx/sites-available/asset-portal.conf
# Replace assets.example.bits-pilani.ac.in with your host name (or the
# server's IP address for an intranet-only start). See DEPLOYMENT.md for HTTPS.

upstream asset_portal {
    server unix:/run/asset-portal/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    # listen [::]:80;            # uncomment if the server has IPv6 enabled
    server_name assets.example.bits-pilani.ac.in;

    # --- HTTPS (uncomment after installing a certificate; see DEPLOYMENT.md) ---
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;   # IPv6 only
    # ssl_certificate     /etc/ssl/asset-portal/fullchain.pem;
    # ssl_certificate_key /etc/ssl/asset-portal/privkey.pem;
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    client_max_body_size 12m;   # bills up to 10 MB, bulk uploads up to 5 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static files (CSS, JS, fonts, logo). Names carry a content hash, so
    # they can be cached for a year.
    location /static/ {
        alias /srv/asset-portal/app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded bills are NOT public. Django checks permission, then replies
    # with "X-Accel-Redirect: /protected-media/<path>" and Nginx sends the file.
    # `internal` means this location can't be requested directly.
    location /protected-media/ {
        internal;
        alias /srv/asset-portal/data/media/;
        # Cache-Control / nosniff headers come from Django's response.
    }

    # Anything under /media/ is refused outright.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://asset_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
}
