<div class="field{% if field.errors %} has-error{% endif %}{% if class %} {{ class }}{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %}<span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not hide_help %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>
