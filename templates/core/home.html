{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="card">
  <h1>Welcome, {{ user.get_short_name }}</h1>
  <dl class="details">
    <dt>Email</dt><dd>{{ user.email }}</dd>
    <dt>Username</dt><dd>{{ user.username }}</dd>
    <dt>Role</dt><dd>{{ user.get_role_display }}</dd>
  </dl>
  <p class="muted">The purchase dashboard will appear here.</p>
</div>
{% endblock %}
