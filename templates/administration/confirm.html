{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card" style="max-width:560px">
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <form method="post" class="actions" style="margin-top:18px">{% csrf_token %}
    <button type="submit" class="btn btn-primary">{{ button }}</button>
    <a class="btn btn-ghost" href="{% url cancel_url %}">Cancel</a>
  </form>
</section>
{% endblock %}
